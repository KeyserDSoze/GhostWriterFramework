name = "models-github-proxy"
main = "src/index.js"
compatibility_date = "2026-07-05"

# The Worker is published on its *.workers.dev subdomain because the
# narrarium.net DNS zone is hosted on GoDaddy, not Cloudflare, so a Cloudflare
# custom_domain route cannot be provisioned here.
#
# Resulting URL after the first deploy:
#   https://models-github-proxy.<your-account-subdomain>.workers.dev
#
# If narrarium.net is ever moved to Cloudflare (infra/models-github-proxy/docs/guida-cloudflare-e-accessi.it.md,
# section 1.8), add a custom domain route and keep `workers_dev = true` until the
# migration is over (adding `routes` without it turns workers.dev off):
#   [[routes]]
#   pattern = "auth.narrarium.net"
#   custom_domain = true
workers_dev = true

# Public configuration of the OAuth token broker (src/oauth.js, src/config.js).
# Nothing secret belongs in this file: the client secrets are Worker secrets named
# GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET and GITHUB_APP_CLIENT_SECRET. The deploy
# workflow uploads them from the GitHub repository secrets GOOGLE_OAUTH_CLIENT_SECRET,
# MICROSOFT_OAUTH_CLIENT_SECRET and GH_APP_CLIENT_SECRET (GitHub forbids repository secret
# names that start with GITHUB_; see README.md), or set them by hand with
# `npx wrangler secret put <NAME>`.
[vars]
# Public client ids, also published in the site (src/narrarium-site/src/config/publicClients.ts).
# They must be the ids the site uses to start the sign-in; change both together.
GOOGLE_CLIENT_ID = "91477716497-k7n97b2q9ic3nc75jpjmb0d3f73s1vgu.apps.googleusercontent.com"
MICROSOFT_CLIENT_ID = "a80b2024-b9e3-4cb1-8480-aac7f164a6eb"
# Client ID of the GitHub App (set after registering the GitHub App; the site publishes the same id).
# While it is empty, GET /oauth/status reports github as false.
GITHUB_APP_CLIENT_ID = ""
# Redirect URIs the broker may exchange a Microsoft or GitHub code for (comma separated, exact match).
# This list replaces the built-in defaults, so keep every entry you still need. A site
# published under a sub-path (GitHub Pages) adds its own callback URL here.
ALLOWED_REDIRECT_URIS = "https://narrarium.net/auth/microsoft-callback.html,https://www.narrarium.net/auth/microsoft-callback.html,http://localhost:5173/auth/microsoft-callback.html,http://localhost:4173/auth/microsoft-callback.html,https://narrarium.net/auth/github/callback,https://www.narrarium.net/auth/github/callback,http://localhost:5173/auth/github/callback,http://localhost:4173/auth/github/callback"
# Extra origins allowed to call the whole Worker, on top of narrarium.net, www.narrarium.net
# and the two localhost dev ports (comma separated, e.g. "https://user.github.io").
ALLOWED_ORIGINS_EXTRA = ""

# Extra per-address limit on POST /oauth/*, shared by the isolates of a Cloudflare location
# (the in-memory limit of src/oauth.js is per isolate). The Worker works without it.
# Needs Wrangler 4.36.0 or later. namespace_id is any integer that is unique in the account.
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "OAUTH_RATE_LIMITER"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 30
  period = 60
