name: Deploy Narrarium Site

# The release lanes (AGENTS.md, "Release lanes"; the decision is scripts/release-lane.mjs):
# - express: a manual run with `fast_track`: build and publish without the tests. With `ref`, a commit of main is published instead of
#   the tip: the rollback (`gh workflow run book-management-system.yml --ref main -f fast_track=true -f ref=<sha>`).
# - quick: a push whose head commit has a `Fast-Track: <reason>` trailer and touches nothing the quick lane refuses: the publication
#   waits for the typecheck, the related tests and the smoke E2E only. The full checks run in the same run and their result is reported.
# - full: every other push, and a manual run without `fast_track`: the publication waits for the full checks.
# The full checks are those of CI (checks.yml), which does not run them again on main for the paths of this workflow.

on:
  workflow_dispatch:
    inputs:
      fast_track:
        description: "Express lane: build and publish without the tests (texts, docs, translations, patch notes, a rollback). Pushes are tested as usual."
        type: boolean
        default: false
      ref:
        description: "Rollback: a commit of main to publish instead of the tip (with the express lane, the commit is published as it was verified)"
        type: string
        default: ""
  push:
    branches:
      - main
      - master
    # The same list is CI's paths-ignore (scripts/fast-track.test.mjs checks it): a push is checked here or there, never by neither.
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - packages/*/README.md
      - packages/engine/**
      - packages/core/**
      - packages/astro-reader/**
      - packages/create-narrarium-book/**
      - src/narrarium-site/**
      - .github/workflows/book-management-system.yml
      - .github/workflows/pages.yml
      - packages/mcp-server/src/index.ts
      - packages/mcp-server/src/public-http-server.ts
      - packages/server/mcp-tools.json
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    name: Release lane
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.decide.outputs.lane }}
      base: ${{ steps.decide.outputs.base }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The lane is decided by the scripts of this commit (the tip, for a rollback too): an older commit may not have them.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the commit to publish
        id: commit
        env:
          REQUESTED: ${{ inputs.ref }}
          EXPRESS: ${{ inputs.fast_track || false }}
        run: |
          if [ -z "$REQUESTED" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EXPRESS" != "true" ]; then
            echo "::error title=A rollback is an express run::Set fast_track with ref: the commit is published as it was when it was verified, without running the checks of today on it."
            exit 1
          fi
          if ! sha="$(git rev-parse --verify --quiet "$REQUESTED^{commit}")"; then
            echo "::error title=Unknown commit::$REQUESTED is not a commit of this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error title=Not a commit of main::$REQUESTED ($sha) is not on main: only a commit that main already has can be published again."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Decide the lane
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          EXPRESS: ${{ inputs.fast_track || false }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/release-lane.mjs decide --event "$EVENT" --base "$BEFORE" --head "$SHA" --express "$EXPRESS"

  quick:
    name: Quick lane (typecheck, unit and related tests)
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'quick' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.lane.outputs.sha }}
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Run the quick checks
        env:
          BASE: ${{ needs.lane.outputs.base }}
        run: node scripts/check-quick.mjs --base "$BASE" --head HEAD --parts tests

  quick-e2e:
    name: Quick lane (smoke E2E, basename)
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'quick' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.lane.outputs.sha }}
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: "true"

      - name: Run the smoke E2E
        env:
          BASE: ${{ needs.lane.outputs.base }}
          SITE_URL: https://narrarium.net
          MCP_PUBLIC_URL: https://narrarium.space/mcp
          MCP_HEALTH_URL: https://narrarium.space/health
          VITE_GITHUB_MODELS_BASE: ${{ vars.VITE_GITHUB_MODELS_BASE }}
        run: node scripts/check-quick.mjs --base "$BASE" --head HEAD --parts e2e

  checks:
    name: Full checks
    needs: lane
    if: ${{ needs.lane.outputs.lane != 'express' }}
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.lane.outputs.sha }}

  publish-express:
    name: Publish (express lane)
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'express' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.lane.outputs.sha }}
      express: true

  publish-quick:
    name: Publish (quick lane)
    needs: [lane, quick, quick-e2e]
    if: ${{ needs.lane.outputs.lane == 'quick' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.lane.outputs.sha }}

  publish-full:
    name: Publish (full lane)
    needs: [lane, checks]
    if: ${{ needs.lane.outputs.lane == 'full' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.lane.outputs.sha }}
