name: Deploy Narrarium Site

on:
  workflow_dispatch:
    inputs:
      fast_track:
        description: "Fast track: build and publish this ref without the tests (use it for a small, already reviewed fix; CI still runs on every push)"
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    paths:
      - README.md
      - AGENTS.md
      - docs/**
      - packages/*/README.md
      - packages/engine/**
      - packages/core/**
      - packages/astro-reader/**
      - packages/create-narrarium-book/**
      - src/narrarium-site/**
      - .github/workflows/book-management-system.yml
      - packages/mcp-server/src/index.ts
      - packages/mcp-server/src/public-http-server.ts
      - packages/server/mcp-tools.json
      - package.json
      - package-lock.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npx --yes npm@12.0.2 ci

      - name: Verify dependency security policy
        if: ${{ !inputs.fast_track }}
        run: npm run dependency:check

      - name: Install Chromium
        if: ${{ !inputs.fast_track }}
        run: npm run e2e:install

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The scaffolder is built too: the site keeps a snapshot of what it writes for a new book, and its tests and its build fail when the snapshot is stale.
      - name: Build Narrarium core, shared engine and book scaffolder
        run: npm run build -w narrarium && npm run build -w narrarium-engine && npm run build:cli -w narrarium-astro-reader && npm run build -w create-narrarium-book

      - name: Test Narrarium site
        if: ${{ !inputs.fast_track }}
        run: npm run test -w narrarium-site

      - name: Build Narrarium site
        env:
          SITE_BASE: /
          SITE_URL: https://narrarium.net
          MCP_PUBLIC_URL: https://narrarium.space/mcp
          MCP_HEALTH_URL: https://narrarium.space/health
          VITE_GITHUB_MODELS_BASE: ${{ vars.VITE_GITHUB_MODELS_BASE }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
        run: npm run docs:build

      - name: Run Narrarium site E2E tests
        if: ${{ !inputs.fast_track }}
        env:
          SITE_BASE: /
          SITE_URL: https://narrarium.net
          MCP_PUBLIC_URL: https://narrarium.space/mcp
          MCP_HEALTH_URL: https://narrarium.space/health
          VITE_GITHUB_MODELS_BASE: ${{ vars.VITE_GITHUB_MODELS_BASE }}
        run: npm run test:e2e:build

      - name: Verify GitHub Pages basename routing
        if: ${{ !inputs.fast_track }}
        run: npm run test:e2e:basename

      - name: Rebuild root-scope E2E site
        if: ${{ !inputs.fast_track }}
        env:
          SITE_BASE: /
          SITE_URL: https://narrarium.net
          MCP_PUBLIC_URL: https://narrarium.space/mcp
          MCP_HEALTH_URL: https://narrarium.space/health
          VITE_GITHUB_MODELS_BASE: ${{ vars.VITE_GITHUB_MODELS_BASE }}
        run: npm run test:e2e:build

      - name: Execute Narrarium site E2E tests
        if: ${{ !inputs.fast_track }}
        env:
          SITE_BASE: /
        run: npm run test:e2e

      - name: Say that the tests were skipped
        if: ${{ inputs.fast_track }}
        run: |
          live="$(curl -fsS --max-time 20 https://narrarium.net/version.json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).version)}catch{console.log("")}})')"
          mine="$(node -p 'require("./src/narrarium-site/package.json").version')"
          {
            echo "### Fast track: the tests were skipped"
            echo "Published without the unit tests, the dependency check and the E2E suites. Run CI on this commit afterwards."
            echo "- site version of this build: \`$mine\`; live now: \`${live:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$live" ] && [ "$live" = "$mine" ]; then
            echo "::warning::This build has the same version as the live site ($mine): browsers that already have that version keep their cached files, so bump the site version for readers to get it."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/narrarium-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
