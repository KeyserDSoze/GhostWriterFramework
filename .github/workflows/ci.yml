name: CI

# The full checks (checks.yml) of every pull request, and of every push to main that the deploy does not check: the deploy
# (book-management-system.yml) runs the same checks for its paths, so they are this workflow's paths-ignore (scripts/fast-track.test.mjs
# keeps the two lists equal). A push that touches both runs both. Run it by hand on any branch (workflow_dispatch) as well.

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - README.md
      - AGENTS.md
      - docs/**
      - packages/*/README.md
      - packages/engine/**
      - packages/core/**
      - packages/astro-reader/**
      - packages/create-narrarium-book/**
      - src/narrarium-site/**
      - .github/workflows/book-management-system.yml
      - .github/workflows/pages.yml
      - packages/mcp-server/src/index.ts
      - packages/mcp-server/src/public-http-server.ts
      - packages/server/mcp-tools.json
      - package.json
      - package-lock.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push of a pull request replaces the older run; every commit of main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
