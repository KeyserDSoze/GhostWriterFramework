name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        env:
          SITE_BASE: /
        run: npm run build

      - name: Install Chromium
        run: npm run e2e:install

      - name: Build E2E site
        env:
          SITE_BASE: /
        run: npm run test:e2e:build

      - name: Run E2E smoke tests
        env:
          SITE_BASE: /
        run: npm run test:e2e

      - name: Validate types
        run: npm run validate

      - name: Run tests
        run: npm run test

      - name: Upload Narrarium site coverage
        uses: actions/upload-artifact@v6
        with:
          name: narrarium-site-coverage
          path: src/narrarium-site/coverage
