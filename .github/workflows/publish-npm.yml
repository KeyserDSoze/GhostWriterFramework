name: Publish npm packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - package-lock.json
      - scripts/**
      - packages/core/**
      - packages/engine/**
      - packages/astro-reader/**
      - packages/mcp-server/**
      - packages/create-narrarium-book/**
  release:
    types:
      - published

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # narrarium-server has its own Trusted Publishing workflow (publish-server-npm.yml).
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'narrarium-server-v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release tag
        if: github.event_name == 'release'
        run: node scripts/check-release-tag.mjs

      - name: Determine publish plan
        id: plan
        run: node scripts/check-unpublished-workspaces.mjs

      - name: No unpublished packages
        if: steps.plan.outputs.has_changes != 'true'
        run: echo "No unpublished package versions detected on this revision."

      - name: Install dependencies
        if: steps.plan.outputs.has_changes == 'true'
        run: npx --yes npm@12.0.2 ci

      - name: Release checks
        if: steps.plan.outputs.has_changes == 'true'
        run: npm run release:check

      - name: Use an npm with Trusted Publishing
        if: steps.plan.outputs.has_changes == 'true'
        run: npm install --global npm@12.0.2

      # npm Trusted Publishing: GitHub proves its identity to npm with OIDC (id-token above), so no
      # npm token is stored. Every package is registered on npmjs.com with this workflow and the
      # `production` environment.
      - name: Publish packages
        if: steps.plan.outputs.has_changes == 'true'
        run: node scripts/publish-workspaces.mjs
