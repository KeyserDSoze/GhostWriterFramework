name: Personal server

on:
  push:
    branches:
      - main
      - master
    paths:
      - package-lock.json
      - packages/core/**
      - packages/engine/**
      - packages/server/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - package-lock.json
      - packages/core/**
      - packages/engine/**
      - packages/server/**
      - .github/workflows/server.yml

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npx --yes npm@12.0.2 ci --no-audit --no-fund

      - name: Build the core and the engine
        run: |
          npm run build -w narrarium
          npm run build -w narrarium-engine

      - name: Build and test the server (locks, vault, supervisor, Cloudflare connector, API)
        shell: bash
        run: |
          set +e
          npm run test -w narrarium-server 2>&1 | tee "$RUNNER_TEMP/server-test.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # The first failures as one annotation, readable without opening the log.
            summary=$(grep -E "^not ok|^# Subtest|^  error:|expected:|actual:|operator:" "$RUNNER_TEMP/server-test.log" | grep -A6 "^not ok" | head -60 | cut -c1-240 | paste -sd '|' -)
            # Node 24 reports in the "spec" format (✖ lines) where Node 22 reports TAP when it is not a terminal.
            if [ -z "$summary" ]; then
              summary=$(grep -E "^\s*✖|AssertionError|expected:|actual:|Error:" "$RUNNER_TEMP/server-test.log" | head -40 | cut -c1-240 | paste -sd '|' -)
            fi
            echo "::error title=Server tests failed::${summary}"
          fi
          exit $code
